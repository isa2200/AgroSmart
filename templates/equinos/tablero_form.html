{% extends 'equinos/base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card unified-dashboard-card text-white shadow-lg">
                <div class="card-header bg-transparent border-bottom border-white border-opacity-25 py-3">
                    <h4 class="mb-0 text-center"><i class="fas fa-edit me-2"></i> Editar Tablero</h4>
                </div>
                
                <div class="card-body p-4">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="{{ form.titulo.id_for_label }}" class="form-label text-white-50">Título</label>
                            {{ form.titulo }}
                            {% if form.titulo.errors %}
                            <div class="text-danger small mt-1">{{ form.titulo.errors.0 }}</div>
                            {% endif %}
                        </div>

                        <div class="mb-4">
                            <label for="{{ form.tipo.id_for_label }}" class="form-label text-white-50">Tipo</label>
                            {{ form.tipo }}
                        </div>

                        <div class="mb-4">
                            <label for="{{ form.contenido.id_for_label }}" class="form-label text-white-50">Contenido</label>
                            <div class="input-group">
                                {{ form.contenido }}
                            </div>
                            <small class="text-white-50 fst-italic mt-1 d-block">Puede usar saltos de línea para organizar la información.</small>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="{% url 'equinos:tablero_list' %}" class="btn btn-outline-light me-md-2">
                                <i class="fas fa-times me-2"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-light text-primary fw-bold">
                                <i class="fas fa-save me-2"></i> Guardar Tablero
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
