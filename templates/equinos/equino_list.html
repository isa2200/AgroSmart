{% extends 'equinos/base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-white" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">Equinos</h2>
        <a href="{% url 'equinos:crear_equino' %}" class="btn btn-light shadow-sm">
            <i class="fas fa-plus"></i> Nuevo Equino
        </a>
    </div>

    <div class="row">
        {% for equino in equinos %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 unified-dashboard-card border-0 text-white">
                <div class="card-body text-center">
                    {% if equino.foto %}
                        <img src="{{ equino.foto.url }}" alt="{{ equino.nombre }}" class="rounded-circle mb-3 shadow" style="width: 120px; height: 120px; object-fit: cover; border: 3px solid rgba(255,255,255,0.5);">
                    {% else %}
                        <div class="rounded-circle mb-3 shadow mx-auto d-flex align-items-center justify-content-center bg-white text-secondary" style="width: 120px; height: 120px; border: 3px solid rgba(255,255,255,0.5);">
                            <i class="fas fa-horse fa-4x"></i>
                        </div>
                    {% endif %}
                    
                    <h4 class="card-title fw-bold">{{ equino.nombre }}</h4>
                    <p class="card-text mb-1"><small>{{ equino.raza }}</small></p>
                    <span class="badge bg-light text-dark mb-3">{{ equino.get_sexo_display }}</span>
                    
                    <div class="d-grid gap-2">
                        <a href="{% url 'equinos:equino_detail' equino.id %}" class="btn btn-outline-light btn-sm">
                            <i class="fas fa-eye"></i> Ver Perfil
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-info bg-white bg-opacity-75 border-0">
                <i class="fas fa-info-circle me-2"></i> No hay equinos registrados.
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
